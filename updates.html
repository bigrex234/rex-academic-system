<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REX // Intelligence Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #050505;
            --panel: #0b0b0d;
            --panel-2: #101013;
            --border: rgba(255,255,255,0.08);
            --text: #f4f4f4;
            --muted: #85858c;
            --red: #ff3030;
            --green: #35e58c;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% -20%, rgba(255, 30, 30, 0.08), transparent 35%),
                linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
                var(--bg);

            background-size:
                auto,
                40px 40px,
                40px 40px;

            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 3px,
                rgba(255,255,255,0.012) 4px
            );
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1200px, 92%);
            margin: auto;
        }

        header {
            padding: 28px 0 20px;
            border-bottom: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--red);
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 11px;
            letter-spacing: 1px;
            color: var(--muted);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(53,229,140,.7);
        }

        .hero {
            padding: 55px 0 35px;
        }

        .eyebrow {
            color: var(--red);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(34px, 6vw, 68px);
            line-height: .95;
            letter-spacing: -3px;
            max-width: 700px;
        }

        .hero p {
            margin-top: 18px;
            max-width: 650px;
            color: var(--muted);
            line-height: 1.7;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 20px 0 30px;
            flex-wrap: wrap;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--muted);
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: .2s;
        }

        .filter:hover {
            border-color: rgba(255,48,48,.4);
            color: white;
        }

        .filter.active {
            background: var(--red);
            border-color: var(--red);
            color: white;
        }

        .refresh-info {
            color: var(--muted);
            font-size: 11px;
        }

        .updates-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            padding-bottom: 60px;
        }

        .card {
            position: relative;
            background:
                linear-gradient(145deg, rgba(255,255,255,.025), transparent),
                var(--panel);

            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;

            min-height: 220px;

            transition:
                transform .2s ease,
                border-color .2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,48,48,.35);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .category {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 6px 9px;
            border-radius: 5px;
            background: rgba(255,48,48,.1);
            color: #ff5959;
        }

        .time {
            font-size: 10px;
            color: var(--muted);
        }

        .card h2 {
            font-size: 20px;
            line-height: 1.25;
            margin-bottom: 12px;
        }

        .card p {
            color: #929298;
            font-size: 13px;
            line-height: 1.7;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            margin-top: 25px;
            padding-top: 15px;

            border-top: 1px solid var(--border);
        }

        .source {
            color: var(--muted);
            font-size: 10px;
            letter-spacing: .5px;
        }

        .open-link {
            color: white;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .open-link:hover {
            color: var(--red);
        }

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        .loading {
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: .4;
            }

            50% {
                opacity: 1;
            }
        }

        footer {
            padding: 25px 0 40px;
            border-top: 1px solid var(--border);
            color: #555;
            font-size: 10px;
            letter-spacing: 1px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .updates-grid {
                grid-template-columns: 1fr;
            }

            .header-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .hero {
                padding-top: 40px;
            }

            h1 {
                letter-spacing: -2px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container header-top">

            <div class="logo">
                REX <span>//</span> INTELLIGENCE HUB
            </div>

            <div class="live-status">
                <div class="live-dot"></div>
                LIVE SYSTEM
            </div>

        </div>
    </header>


    <main class="container">

        <section class="hero">

            <div class="eyebrow">
                PERSONAL INTELLIGENCE FEED
            </div>

            <h1>
                Stay updated.<br>
                Stay ahead.
            </h1>

            <p>
                Live updates across your academics, NASA, Python development
                and anime tracking — pulled automatically from external sources.
            </p>

        </section>


        <section class="controls">

            <div class="filters">

                <button class="filter active" data-filter="all">
                    ALL
                </button>

                <button class="filter" data-filter="study">
                    STUDY
                </button>

                <button class="filter" data-filter="nasa">
                    NASA
                </button>

                <button class="filter" data-filter="python">
                    PYTHON
                </button>

                <button class="filter" data-filter="anime">
                    ANIME
                </button>

            </div>

            <div class="refresh-info">
                <span id="lastUpdated">Connecting...</span>
            </div>

        </section>


        <section id="updatesGrid" class="updates-grid">

            <div class="loading">
                INITIALIZING LIVE FEED...
            </div>

        </section>

    </main>


    <footer>
        REX // ACADEMIC SYSTEM — INTELLIGENCE HUB
    </footer>


    <script src="updates.js"></script>

</body>
</html>
